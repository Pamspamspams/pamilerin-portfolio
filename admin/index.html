<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager · Pamilerin Sanni</title>
    <style>
        body { background: #0a1a12; font-family: 'Inter', sans-serif; color: white; margin: 0; }
    </style>
</head>
<body>
    <script src="/admin/decap-cms.js"></script>
    <script>
        window.onload = function() {
            if (window.CMS) {
                CMS.init({
                    config: {
                        backend: {
                            name: 'github',
                            repo: 'Pampspampamps/pamilerin-portfolio',
                            branch: 'main',
                            base_url: 'https://pamilerin-portfolio.pages.dev',
                        },
                        media_folder: 'assets/images',
                        public_folder: '/assets/images',
                        collections: [
                            {
                                name: 'blog',
                                label: 'Blog Posts',
                                folder: '_posts/blog',
                                create: true,
                                fields: [
                                    { name: 'title', label: 'Title', widget: 'string' },
                                    { name: 'date', label: 'Date', widget: 'datetime' },
                                    { name: 'body', label: 'Body', widget: 'markdown' }
                                ]
                            },
                            {
                                name: 'news',
                                label: 'News Articles',
                                folder: '_posts/news',
                                create: true,
                                fields: [
                                    { name: 'title', label: 'Title', widget: 'string' },
                                    { name: 'date', label: 'Date', widget: 'datetime' },
                                    { name: 'body', label: 'Body', widget: 'markdown' }
                                ]
                            }
                        ]
                    }
                });
            } else {
                document.body.innerHTML = '<p style="padding:20px;">Error: CMS not loaded from /admin/decap-cms.js</p>';
            }
        };
    </script>
</body>
</html>
