<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Page Not Found · Pamilerin Sanni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #ffffff;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .error-box { max-width: 500px; }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            color: #b8860b;
            line-height: 1;
            margin-bottom: 10px;
        }
        h1 { font-size: 28px; font-weight: 800; color: #1a1a1a; margin-bottom: 12px; }
        p { color: #6c757d; font-size: 15px; margin-bottom: 24px; }
        .btn-home {
            display: inline-block;
            background: linear-gradient(135deg, #d4a745, #b8860b);
            color: #fff;
            padding: 12px 32px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-home:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(184,134,11,0.3); color: #fff; }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn-home"><i class="fas fa-home me-2"></i>Back to Homepage</a>
    </div>
</body>
</html>
